<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent & Task Movement Visualization</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        #plotDiv {
            width: 100%;
            height: 700px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .speed-control {
            display: inline-block;
            margin: 10px 20px;
        }
        .speed-control label {
            font-weight: bold;
            margin-right: 10px;
            color: #333;
        }
        .speed-control input {
            width: 200px;
            cursor: pointer;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 1em;
        }
        .stat-card p {
            margin: 0;
            font-size: 1.8em;
            font-weight: bold;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .legend-square {
            width: 16px;
            height: 16px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Agent & Task Movement Visualization</h1>
        <div class="info">
            Interactive timeline showing 10 agents moving through space and completing tasks
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Agents</h3>
                <p id="agentCount">10</p>
            </div>
            <div class="stat-card">
                <h3>Time Steps</h3>
                <p id="timeSteps">-</p>
            </div>
            <div class="stat-card">
                <h3>Current Time</h3>
                <p id="currentTime">0.0</p>
            </div>
            <div class="stat-card">
                <h3>Active Tasks</h3>
                <p id="taskCount">0</p>
            </div>
        </div>

        <div id="plotDiv"></div>

        <div class="controls">
            <button onclick="resetAnimation()">⏮ Reset</button>
            <button onclick="toggleAnimation()" id="playBtn">▶️ Play</button>
            <button onclick="stepForward()">⏭ Step Forward</button>
            
            <div class="speed-control">
                <label for="speedSlider">Animation Speed:</label>
                <input type="range" id="speedSlider" min="10" max="200" value="50" onchange="updateSpeed()">
                <span id="speedValue">50ms</span>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background: #FF6B6B;"></div>
                    <span>Agents (circles)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-square" style="background: #FFD700;"></div>
                    <span>Tasks (squares)</span>
                </div>
            </div>
        </div>
    </div>

        let currentFrame = 0;
        let isPlaying = false;
        let animationInterval;
        let animationSpeed = 50;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('timeSteps').textContent = vizData.timeline.length;
            initializePlot();
        });

        function initializePlot() {
            const firstFrame = vizData.timeline[0];
            
            // Create traces for each agent
            const traces = [];
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'
            ];

            // Agent markers
            for (let i = 0; i < vizData.meta.num_agents; i++) {
                const agent = firstFrame.agents[i];
                traces.push({
                    x: [agent.x],
                    y: [agent.y],
                    mode: 'markers+text',
                    type: 'scatter',
                    name: `Agent ${i}`,
                    marker: {
                        size: 20,
                        color: colors[i],
                        line: {
                            color: 'white',
                            width: 2
                        }
                    },
                    text: [`${i}`],
                    textposition: 'middle center',
                    textfont: {
                        color: 'white',
                        size: 12,
                        family: 'Arial Black'
                    },
                    hovertemplate: `<b>Agent ${i}</b><br>` +
                                  'X: %{x:.2f}<br>' +
                                  'Y: %{y:.2f}<br>' +
                                  '<extra></extra>'
                });
            }

            // Agent paths
            for (let i = 0; i < vizData.meta.num_agents; i++) {
                traces.push({
                    x: [firstFrame.agents[i].x],
                    y: [firstFrame.agents[i].y],
                    mode: 'lines',
                    type: 'scatter',
                    name: `Path ${i}`,
                    line: {
                        color: colors[i],
                        width: 1.5,
                        dash: 'dot'
                    },
                    opacity: 0.4,
                    showlegend: false,
                    hoverinfo: 'skip'
                });
            }

            // Task markers
            const taskTrace = {
                x: [],
                y: [],
                mode: 'markers+text',
                type: 'scatter',
                name: 'Tasks',
                marker: {
                    size: 18,
                    color: '#FFD700',
                    symbol: 'square',
                    line: {
                        color: 'orange',
                        width: 2
                    }
                },
                text: [],
                textposition: 'middle center',
                textfont: {
                    color: 'black',
                    size: 10,
                    family: 'Arial Black'
                },
                hovertemplate: '<b>Task %{text}</b><br>' +
                              'X: %{x:.2f}<br>' +
                              'Y: %{y:.2f}<br>' +
                              '<extra></extra>'
            };

            if (firstFrame.tasks && firstFrame.tasks.length > 0) {
                firstFrame.tasks.forEach(task => {
                    taskTrace.x.push(task.x);
                    taskTrace.y.push(task.y);
                    taskTrace.text.push(task.id.toString());
                });
            }
            traces.push(taskTrace);

            document.getElementById('taskCount').textContent = firstFrame.tasks ? firstFrame.tasks.length : 0;

            const layout = {
                title: {
                    text: `Time: ${firstFrame.t.toFixed(1)} | Agents: ${vizData.meta.num_agents} | Tasks: ${firstFrame.tasks ? firstFrame.tasks.length : 0}`,
                    font: { size: 20 }
                },
                xaxis: {
                    title: 'X Position',
                    range: [0, 2000],
                    gridcolor: '#e0e0e0',
                    zeroline: false
                },
                yaxis: {
                    title: 'Y Position',
                    range: [0, 2000],
                    gridcolor: '#e0e0e0',
                    zeroline: false,
                    scaleanchor: 'x',
                    scaleratio: 1
                },
                hovermode: 'closest',
                showlegend: true,
                legend: {
                    x: 1.02,
                    y: 1,
                    bgcolor: 'rgba(255,255,255,0.8)',
                    bordercolor: '#ccc',
                    borderwidth: 1
                },
                plot_bgcolor: '#fafafa',
                paper_bgcolor: 'white'
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            };

            Plotly.newPlot('plotDiv', traces, layout, config);
        }

        function updatePlot() {
            if (currentFrame >= vizData.timeline.length) {
                stopAnimation();
                return;
            }

            const frame = vizData.timeline[currentFrame];
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'
            ];

            // Update agent positions
            for (let i = 0; i < vizData.meta.num_agents; i++) {
                const agent = frame.agents[i];
                Plotly.update('plotDiv', 
                    {
                        x: [[agent.x]],
                        y: [[agent.y]],
                        text: [[`${i}`]]
                    },
                    {},
                    [i]
                );

                // Update paths
                const path_x = [];
                const path_y = [];
                
                for (let t = 0; t <= currentFrame && t < vizData.timeline.length; t++) {
                    const pastAgent = vizData.timeline[t].agents[i];
                    path_x.push(pastAgent.x);
                    path_y.push(pastAgent.y);
                }
                
                Plotly.update('plotDiv', 
                    {
                        x: [path_x],
                        y: [path_y]
                    },
                    {},
                    [vizData.meta.num_agents + i]
                );
            }

            // Update tasks
            const taskTrace = {
                x: [[]],
                y: [[]],
                text: [[]]
            };

            if (frame.tasks && frame.tasks.length > 0) {
                frame.tasks.forEach(task => {
                    taskTrace.x[0].push(task.x);
                    taskTrace.y[0].push(task.y);
                    taskTrace.text[0].push(task.id.toString());
                });
            }

            Plotly.update('plotDiv', 
                taskTrace,
                {
                    'title.text': `Time: ${frame.t.toFixed(1)} | Agents: ${vizData.meta.num_agents} | Tasks: ${frame.tasks ? frame.tasks.length : 0}`
                },
                [vizData.meta.num_agents * 2]
            );

            document.getElementById('currentTime').textContent = frame.t.toFixed(1);
            document.getElementById('taskCount').textContent = frame.tasks ? frame.tasks.length : 0;
        }

        function toggleAnimation() {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸ Pause';
            animationInterval = setInterval(() => {
                currentFrame++;
                if (currentFrame >= vizData.timeline.length) {
                    stopAnimation();
                    currentFrame = vizData.timeline.length - 1;
                }
                updatePlot();
            }, animationSpeed);
        }

        function stopAnimation() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️ Play';
            if (animationInterval) {
                clearInterval(animationInterval);
            }
        }

        function resetAnimation() {
            stopAnimation();
            currentFrame = 0;
            updatePlot();
        }

        function stepForward() {
            stopAnimation();
            if (currentFrame < vizData.timeline.length - 1) {
                currentFrame++;
                updatePlot();
            }
        }

        function updateSpeed() {
            const slider = document.getElementById('speedSlider');
            animationSpeed = parseInt(slider.value);
            document.getElementById('speedValue').textContent = animationSpeed + 'ms';
            
            if (isPlaying) {
                stopAnimation();
                startAnimation();
            }
        }
    </script>
