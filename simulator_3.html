<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Movement Visualization</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        #plotDiv {
            width: 100%;
            height: 700px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .speed-control {
            display: inline-block;
            margin: 10px 20px;
        }
        .speed-control label {
            font-weight: bold;
            margin-right: 10px;
            color: #333;
        }
        .speed-control input {
            width: 200px;
            cursor: pointer;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .stat-card p {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Agent Movement Visualization</h1>
        <div class="info">
            Interactive timeline showing 10 agents moving through space over time
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Agents</h3>
                <p id="agentCount">10</p>
            </div>
            <div class="stat-card">
                <h3>Time Steps</h3>
                <p id="timeSteps">-</p>
            </div>
            <div class="stat-card">
                <h3>Current Time</h3>
                <p id="currentTime">0.0</p>
            </div>
        </div>

        <div id="plotDiv"></div>

        <div class="controls">
            <button onclick="resetAnimation()">⏮ Reset</button>
            <button onclick="toggleAnimation()" id="playBtn">▶️ Play</button>
            <button onclick="stepForward()">⏭ Step Forward</button>
            
            <div class="speed-control">
                <label for="speedSlider">Animation Speed:</label>
                <input type="range" id="speedSlider" min="10" max="200" value="50" onchange="updateSpeed()">
                <span id="speedValue">50ms</span>
            </div>
        </div>
    </div>

    <script>
        let data;
        let currentFrame = 0;
        let isPlaying = false;
        let animationInterval;
        let animationSpeed = 50;

        // Load and process the JSON data
        fetch('/mnt/user-data/uploads/viz.json')
            .then(response => response.json())
            .then(jsonData => {
                data = jsonData;
                document.getElementById('timeSteps').textContent = data.timeline.length;
                initializePlot();
            })
            .catch(error => {
                console.error('Error loading data:', error);
                alert('Error loading data file. Please make sure viz.json is in the correct location.');
            });

        function initializePlot() {
            const firstFrame = data.timeline[0];
            
            // Create traces for each agent
            const traces = [];
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'
            ];

            for (let i = 0; i < data.meta.num_agents; i++) {
                const agent = firstFrame.agents[i];
                traces.push({
                    x: [agent.x],
                    y: [agent.y],
                    mode: 'markers+text',
                    type: 'scatter',
                    name: `Agent ${i}`,
                    marker: {
                        size: 20,
                        color: colors[i],
                        line: {
                            color: 'white',
                            width: 2
                        }
                    },
                    text: [`${i}`],
                    textposition: 'middle center',
                    textfont: {
                        color: 'white',
                        size: 12,
                        family: 'Arial Black'
                    },
                    hovertemplate: `<b>Agent ${i}</b><br>` +
                                  'X: %{x:.2f}<br>' +
                                  'Y: %{y:.2f}<br>' +
                                  '<extra></extra>'
                });
            }

            // Add paths for each agent
            for (let i = 0; i < data.meta.num_agents; i++) {
                const path_x = [];
                const path_y = [];
                
                for (let t = 0; t <= currentFrame && t < data.timeline.length; t++) {
                    const agent = data.timeline[t].agents[i];
                    path_x.push(agent.x);
                    path_y.push(agent.y);
                }
                
                traces.push({
                    x: path_x,
                    y: path_y,
                    mode: 'lines',
                    type: 'scatter',
                    name: `Path ${i}`,
                    line: {
                        color: colors[i],
                        width: 1.5,
                        dash: 'dot'
                    },
                    opacity: 0.4,
                    showlegend: false,
                    hoverinfo: 'skip'
                });
            }

            const layout = {
                title: {
                    text: `Agent Positions at Time: ${firstFrame.t.toFixed(1)}`,
                    font: { size: 20 }
                },
                xaxis: {
                    title: 'X Position',
                    range: [0, 2000],
                    gridcolor: '#e0e0e0',
                    zeroline: false
                },
                yaxis: {
                    title: 'Y Position',
                    range: [0, 2000],
                    gridcolor: '#e0e0e0',
                    zeroline: false,
                    scaleanchor: 'x',
                    scaleratio: 1
                },
                hovermode: 'closest',
                showlegend: true,
                legend: {
                    x: 1.02,
                    y: 1,
                    bgcolor: 'rgba(255,255,255,0.8)',
                    bordercolor: '#ccc',
                    borderwidth: 1
                },
                plot_bgcolor: '#fafafa',
                paper_bgcolor: 'white'
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            };

            Plotly.newPlot('plotDiv', traces, layout, config);
        }

        function updatePlot() {
            if (currentFrame >= data.timeline.length) {
                stopAnimation();
                return;
            }

            const frame = data.timeline[currentFrame];
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52B788'
            ];

            const updates = {
                x: [],
                y: [],
                text: []
            };

            const pathUpdates = [];

            // Update agent positions
            for (let i = 0; i < data.meta.num_agents; i++) {
                const agent = frame.agents[i];
                updates.x.push([agent.x]);
                updates.y.push([agent.y]);
                updates.text.push([`${i}`]);

                // Update paths
                const path_x = [];
                const path_y = [];
                
                for (let t = 0; t <= currentFrame && t < data.timeline.length; t++) {
                    const pastAgent = data.timeline[t].agents[i];
                    path_x.push(pastAgent.x);
                    path_y.push(pastAgent.y);
                }
                
                pathUpdates.push({
                    x: [path_x],
                    y: [path_y]
                });
            }

            // Update all traces
            const indices = [];
            for (let i = 0; i < data.meta.num_agents; i++) {
                indices.push(i);
            }
            
            Plotly.update('plotDiv', 
                {...updates}, 
                {'title.text': `Agent Positions at Time: ${frame.t.toFixed(1)}`},
                indices
            );

            // Update path traces
            for (let i = 0; i < data.meta.num_agents; i++) {
                Plotly.update('plotDiv', 
                    pathUpdates[i], 
                    {},
                    [data.meta.num_agents + i]
                );
            }

            document.getElementById('currentTime').textContent = frame.t.toFixed(1);
        }

        function toggleAnimation() {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸ Pause';
            animationInterval = setInterval(() => {
                currentFrame++;
                if (currentFrame >= data.timeline.length) {
                    stopAnimation();
                    currentFrame = data.timeline.length - 1;
                }
                updatePlot();
            }, animationSpeed);
        }

        function stopAnimation() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️ Play';
            if (animationInterval) {
                clearInterval(animationInterval);
            }
        }

        function resetAnimation() {
            stopAnimation();
            currentFrame = 0;
            updatePlot();
        }

        function stepForward() {
            stopAnimation();
            if (currentFrame < data.timeline.length - 1) {
                currentFrame++;
                updatePlot();
            }
        }

        function updateSpeed() {
            const slider = document.getElementById('speedSlider');
            animationSpeed = parseInt(slider.value);
            document.getElementById('speedValue').textContent = animationSpeed + 'ms';
            
            if (isPlaying) {
                stopAnimation();
                startAnimation();
            }
        }
    </script>
</body>
</html>
